# Placeholder configuration for the native Hailo Android service.
# Replace these paths and values when the real HailoRT stack is added.

# Loaded with dlopen after the driver reports ready (build: proprietary_vendor_brcm/rpi5/tools/build_hailort_android.sh).
runtime_library=/vendor/lib64/libhailort.so
model_path=/vendor/etc/hailo/models/default.hef
firmware_dir=/vendor/firmware/hailo
# The first entry is mandatory, the others are optional.
firmware_files=hailo8_fw.bin,hailo8_board_cfg.bin,hailo8_fw_cfg.bin
camera_source=libcamera
ipc_backend=aidl
